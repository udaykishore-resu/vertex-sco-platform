# HAProxy VIP in front of the 3-node EMQX cluster. Vertex services connect
# to mqtt-lb:1883; if one EMQX node fails, HAProxy stops routing to it
# within a few health-check intervals and existing MQTT clients reconnect
# (see internal/eventbus/mqtt.go's reconnect loop) against a healthy node.
global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client  1m
    timeout server  1m

frontend mqtt_in
    bind *:1883
    default_backend emqx_cluster

backend emqx_cluster
    balance leastconn
    option tcp-check
    server emqx1 emqx1:1883 check inter 2s fall 3 rise 2
    server emqx2 emqx2:1883 check inter 2s fall 3 rise 2
    server emqx3 emqx3:1883 check inter 2s fall 3 rise 2

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
